<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../../../public/style/output.css" />
  </head>
  <style>
    .loader-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(51, 51, 51, 0.6);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: row;
    }

    .bar {
      display: inline-block;
      width: 10px;
      height: 20px;
      background-color: rgba(0, 0, 0, 0.8);
      border-radius: 10px;
      animation: scale-up4 1s linear infinite;
    }

    .bar:nth-child(2) {
      height: 45px;
      margin: 0 5px;
      animation-delay: 0.25s;
    }

    .bar:nth-child(3) {
      animation-delay: 0.5s;
    }

    @keyframes scale-up4 {
      20% {
        background-color: #fff;
        transform: scaleY(2.5);
      }
      40% {
        transform: scaleY(2);
      }
    }

    .hidden {
      display: none;
    }
  </style>
  <body>
    <!-- is loading -->
    <div class="hidden loader-backdrop" id="loading-backdrop">
      <div class="loader" id="loading-spinner">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </div>
    <div class="bg-gray-50 w-full">
      <div class="flex flex-row justify-between pt-3 pr-4">
        <div class="flex flex-row pt-10 pl-4 gap-3">
          <img
            src="../../../public/assets/img/arrow-left-short.png"
            alt="arrow"
            id="back-arrow"
          />
          <h3 class="font-bold text-2xl text-[#152536]">Checkout</h3>
        </div>

        <img
          src="../../../public/assets/img/more.svg"
          alt="more"
          class="h-8 w-8 mt-10"
        />
      </div>

      <h2 class="font-bold text-xl text-[#152536] pl-6 pt-5 pb-5">
        Shipping Address
      </h2>

      <div class="w-full flex flex-col gap-5 pt-2 pl-5 pr-5">
        <div
          class="flex flex-row justify-between gap-14 rounded-3xl bg-white p-2"
        >
          <div class="flex flex-row justify-center gap-3">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-geo-alt-fill w-10 h-10"
              viewBox="0 0 16 16"
            >
              <path
                d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"
              />
            </svg>
            <div class="flex flex-col">
              <h1 class="font-bold text-xl text-[#152536]">Home</h1>
              <p class="text-gray-400">Lorem ipsum dolor sit</p>
            </div>
          </div>
          <div class="flex items-center">
            <button class="pr-6">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-pen-fill w-6 h-6"
                viewBox="0 0 16 16"
              >
                <path
                  d="m13.498.795.149-.149a1.207 1.207 0 1 1 1.707 1.708l-.149.148a1.5 1.5 0 0 1-.059 2.059L4.854 14.854a.5.5 0 0 1-.233.131l-4 1a.5.5 0 0 1-.606-.606l1-4a.5.5 0 0 1 .131-.232l9.642-9.642a.5.5 0 0 0-.642.056L6.854 4.854a.5.5 0 1 1-.708-.708L9.44.854A1.5 1.5 0 0 1 11.5.796a1.5 1.5 0 0 1 1.998-.001"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <hr class="m-6" />

      <div>
        <h3 class="font-bold text-xl text-[#152536] pl-6 pb-3">Order list</h3>

        <div id="checkout-container" class="pl-5 pr-5 flex flex-col gap-5">
          <!-- <div
            class="flex flex-row gap-2 rounded-3xl w-full shadow-lg bg-white p-2 "
          >
            <div class="bg-[#F3F3F3] rounded-3xl w-24 p-2 ">
              <img
                src="../../../public/assets/img/shoes/Rectangle 7.png"
                alt="puma"
                class="w-16 h-16"
              />
            </div>
            <div class="flex flex-col ">
              <h2 class="text-[#152536] font-bold text-lg">
                Running Sportwear
              </h2>
              <div class="flex flex-row gap-44">
                <h3 class="text-[#152536] font-bold text-lg">$150.00</h3>
<h4 class="rounded-full bg-[#F3F3F3] w-10 h-10 flex justify-center items-center  ">2</h4>

              </div>
            </div>
          </div> -->
        </div>
      </div>

      <hr class="m-6" />

      <div>
        <h3 class="font-bold text-xl text-[#152536] pl-6 pb-3">
          Choose Shipping
        </h3>

        <div class="w-full flex flex-col gap-5 pt-2 pl-5 pr-5">
          <div
            class="flex flex-row justify-between gap-14 rounded-3xl bg-white p-3"
          >
            <div class="flex flex-row justify-center gap-3">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-truck w-8 h-8 fill-black"
                viewBox="0 0 16 16"
              >
                <path
                  d="M0 3.5A1.5 1.5 0 0 1 1.5 2h9A1.5 1.5 0 0 1 12 3.5V5h1.02a1.5 1.5 0 0 1 1.17.563l1.481 1.85a1.5 1.5 0 0 1 .329.938V10.5a1.5 1.5 0 0 1-1.5 1.5H14a2 2 0 1 1-4 0H5a2 2 0 1 1-3.998-.085A1.5 1.5 0 0 1 0 10.5zm1.294 7.456A2 2 0 0 1 4.732 11h5.536a2 2 0 0 1 .732-.732V3.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5v7a.5.5 0 0 0 .294.456M12 10a2 2 0 0 1 1.732 1h.768a.5.5 0 0 0 .5-.5V8.35a.5.5 0 0 0-.11-.312l-1.48-1.85A.5.5 0 0 0 13.02 6H12zm-9 1a1 1 0 1 0 0 2 1 1 0 0 0 0-2m9 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2"
                />
              </svg>
              <div class="flex flex-col">
                <h2 class="font-bold text-xl text-[#152536]">
                  Choose Shipping Type
                </h2>
              </div>
            </div>
            <div class="flex items-center">
              <button class="pr-6">
                <img
                  src="../../../public/assets/img/right-arrow-svgrepo-com.svg"
                  alt="rightarrow"
                  class="w-6 h-6"
                />
              </button>
            </div>
          </div>
        </div>
      </div>

      <hr class="m-6" />

      <div class="pl-6 pr-8 flex flex-col">
        <h2 class="font-bold text-xl text-[#152536] pb-3">Promo Code</h2>
        <div class="flex flex-row justify-between gap-3 pt-5">
          <input
            type="text"
            placeholder="Enter Promo Code"
            class="p-4 pr-28 bg-slate-100 rounded-2xl"
          />
          <button>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-plus-circle-fill w-12 h-12"
              viewBox="0 0 16 16"
            >
              <path
                d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="w-full flex flex-col gap-5 pt-5 pl-5 pr-5">
        <div
          class="flex flex-col justify-between gap-10 rounded-3xl bg-white p-3 pl-5 pr-5"
        >
          <div class="w-full flex flex-row justify-between pt-5">
            <h2 class="text-base text-[#152536]">Amount</h2>
            <p
              id="checkout-total"
              class="text-base font-bold text-[#152536]"
            ></p>
          </div>
          <div class="w-full flex flex-row justify-between">
            <h2 class="text-base text-[#152536]">Shipping</h2>
            <p class="text-base font-bold text-[#152536]">-</p>
          </div>
          <hr class="m-1" />
          <div class="w-full flex flex-row justify-between pb-8">
            <h2 class="text-base text-[#152536]">Total</h2>
            <p class="text-base font-bold text-[#152536]">-</p>
          </div>
        </div>
      </div>

      <div class="pl-5 pr-5 pt-44">
        <button
          id="Payment"
          type="submit"
          class="bg-slate-950 rounded-3xl text-white w-full h-14 mt-40 mb-5"
        >
          Continue to Payment
        </button>
      </div>
    </div>
    <script src="./checkout.js"></script>
  </body>
</html>
