  <style>
   input[type="radio"] {
      width: 24px;
      height: 24px;
      border: 2px solid #ccc;
      border-radius: 50%;
      appearance: none; 
      outline: none;
      cursor: pointer;
      transition: background-color 0.3s, border-color 0.3s;
      position: relative;
    }

    input[type="radio"]:checked {
      background-color: white; 
      border-color: black; 
      border: 2px solid;
    }

    input[type="radio"]:checked::before {
      content: "";
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: black; 
      display: block;
      margin: 4px; 
      position: absolute; 
      top: 30%; 
      left: 30%; 
      right: 40%;
      bottom: 50%;
      transform: translate(-50%, -50%);
    }
    .loader-backdrop {
position: fixed; 
top: 0;
left: 0;
width: 100%; 
height: 100%; 
background: rgba(51, 51, 51, 0.6); 
z-index: 9999; 
display: flex; 
align-items: center;    
justify-content: center; 
}

.loader {
display: flex;    
align-items: center; 
justify-content: center; 
flex-direction: row; 
}

.bar {
display: inline-block;
width: 10px;
height: 20px;
background-color: rgba(0, 0, 0, 0.8); 
border-radius: 10px; 
animation: scale-up4 1s linear infinite; 
}

.bar:nth-child(2) {
height: 45px;
margin: 0 5px;
animation-delay: 0.25s;
}

.bar:nth-child(3) {
animation-delay: 0.5s; 
}

@keyframes scale-up4 {
20% {
 background-color: #fff;
 transform: scaleY(2.5); 
}
40% {
 transform: scaleY(2); 
}
}

.hidden {
   display: none;
 }
  </style>
