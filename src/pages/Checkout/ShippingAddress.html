  <style>
   input[type="radio"] {
      width: 24px;
      height: 24px;
      border: 2px solid #ccc;
      border-radius: 50%;
      appearance: none; 
      outline: none;
      cursor: pointer;
      transition: background-color 0.3s, border-color 0.3s;
      position: relative;
    }

    input[type="radio"]:checked {
      background-color: white; 
      border-color: black; 
      border: 2px solid;
    }

    input[type="radio"]:checked::before {
      content: "";
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: black; 
      display: block;
      margin: 4px; 
      position: absolute; 
      top: 30%; 
      left: 30%; 
      right: 40%;
      bottom: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
