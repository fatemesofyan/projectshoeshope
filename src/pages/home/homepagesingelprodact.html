<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../../../public/style/output.css" />
  </head>
  <style>
    html,body{
        overflow-x: hidden;
        overflow-y: hidden;

    }
    .loader-backdrop {
  position: fixed; 
  top: 0;
  left: 0;
  width: 100%; 
  height: 100%; 
  background: rgba(51, 51, 51, 0.6); 
  z-index: 9999; 
  display: flex; 
  align-items: center;    
  justify-content: center; 
}

.loader {
  display: flex;    
  align-items: center; 
  justify-content: center; 
  flex-direction: row; 
}

.bar {
  display: inline-block;
  width: 10px;
  height: 20px;
  background-color: rgba(0, 0, 0, 0.8); 
  border-radius: 10px; 
  animation: scale-up4 1s linear infinite; 
}

.bar:nth-child(2) {
  height: 45px;
  margin: 0 5px;
  animation-delay: 0.25s;
}

.bar:nth-child(3) {
  animation-delay: 0.5s; 
}

@keyframes scale-up4 {
  20% {
    background-color: #fff;
    transform: scaleY(2.5); 
  }
  40% {
    transform: scaleY(2); 
  }
}

.hidden {
      display: none;
    }
    
  </style>
  <body>
   
    <div class="w-full ">
      <div class=" w-full bg-[#f6f6f6]">
        <img
        src="../../../public/assets/img/arrow-left-short.png"
        alt="arrow"
        class="cursor-pointer pt-8 pl-5 bg-[#f6f6f6]"
        id="back-arrow"
      />
      </div>
      <!-- is loading -->
<div
class="hidden loader-backdrop"
id="loading-backdrop"
>
<div class="loader" id="loading-spinner">
  <span class="bar"></span>
  <span class="bar"></span>
  <span class="bar"></span>
</div>
</div>
     
        <div id="product-image-container" class="w-full h-[300px] bg-[#f6f6f6]">
            
            <div class="flex justify-center">
              <!-- <img
                src="../../../public/assets/img/shoes/nike/Rectangle 6 (1).png"
                alt="nike"
                class="w-72 h-72"
              /> -->
            </div>
          </div>
      <!-- <img src="../../../public/assets/img/like-svgrepo-com.svg" alt="likeRed" class="w-8 h-8"> -->
          <div   class="flex flex-row justify-between pt-5 pb-2 pr-6 pl-6">
            <h2 id="product-name" class="text-[#152536] font-bold text-2xl truncate max-w-[calc(100%-50px)]"></h2>
          <button  onclick="toggleLike(this)">
            <img src="../../../public/assets/img/heart (1).png" alt="like" class="cursor-pointer w-8 h-8"   />
          </button>
          </div>
      <hr class="m-6">
      
          <div class="pl-6   ">
            <h3 class="font-bold text-lg text-[#152536]">Description</h3>
            <p id="product-description" class="text-gray-600">
           
            </p>
          </div>
      
          <div id="product-details" class=" w-full flex flex-ro items-center gap-14  pl-5 pt-8 ">
           
          </div>

          
          
          
      
          <div class="flex flex-row justify-start items-center gap-10 pt-8 pl-6 pb-2">
            <h3 class="font-bold text-lg text-[#152536]">Quantity</h3>
      
      <div class="bg-[#F3F3F3] rounded-3xl  ">
          
          <button id="decrease-btn" class="bg-[#F3F3F3] p-2 pl-5 rounded-l-3xl font-bold text-2xl">-</button>
          <span id="quantity"  class="bg-[#F3F3F3] p-2  text-2xl">0</span>
          <button id="increase-btn" class="bg-[#F3F3F3] p-2 pr-5 rounded-r-3xl font-bold text-2xl">+</button>
      </div>
      
          </div>
      
      
      <hr class="m-6 ">
      
          <footer class="flex flex-row justify-around pt-2 ">
            <div class="flex flex-col">
              <h6  class="text-gray-700 ">Total price</h6>
              <h2  id="product-price"class="font-bold text-2xl"></h2>
            </div>
      
            <button id="addtoCart"
              class="flex flex-row justify-center items-center gap-5 bg-slate-950 text-white text-lg rounded-3xl p-4 pr-16 pl-14"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-bag-fill w-6 h-6"
                viewBox="0 0 16 16"
              >
                <path
                  d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4z"
                /></svg
              >Add to cart
            </button>
          </footer>
    </div>
   <script src="./singelproduct.js"></script>
  </body>
</html>
