<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../../../public/style/output.css" />
  </head>

  <body>
    <header
      class="flex flex-row justify-between w-full p-3 fixed top-0 bg-white z-10 shadow-lg"
    >
      <div class="flex flex-row gap-2 items-center pl-3">
        <img
          src="../../../public/assets/img/profile.png"
          alt="profile"
          class="w-8 h-8"
        />

        <div class="flex flex-col">
          <h6 class="text-[#757475] text-base flex">
            Good Morning
            <img
              src="../../../public/assets/img/👋.png"
              alt="handhi"
              class="w-4 h-4"
            />
          </h6>
          <h2 class="font-bold text-base">Fateme sofyan</h2>
        </div>
      </div>
      <div class="flex gap-3 pr-4 pt-3">
        <img
          src="../../../public/assets/img/bell.png"
          alt="bell"
          class="w-6 h-6"
        />
        <img
        id="likelist"
          src="../../../public/assets/img/heart (1).png"
          alt="heart"
          class="w-6 h-6 cursor-pointer"
        />
      </div>
    </header>

    <div class="flex p-5 pt-24">
      <button
        type="submit"
        class="p-2 bg-[#ECECEC] text-white rounded-l-md border-none focus:outline-none"
        onclick="searchTasks()"
      >
        <img src="../../../public/assets/img/search.png" alt="search" />
      </button>
      <input
        type="text"
        placeholder="search"
        class="w-full pl-6 pr-2 bg-[#ECECEC] border-none rounded-r-md text-sm text-black focus:outline-none p-2"
        id="searchInput"
      />
    </div>

    <div  class="w-full grid grid-cols-4 gap-5 justify-items-center">
      <button  id="nike-button">
        <img
          src="../../../public/assets/img/company/company (1).png"
          alt="nike"
        />
      </button>
      <button id="adidas-button">
        <img
          src="../../../public/assets/img/company/company (2).png"
          alt="adidas"
        />
      </button>
      <button id="puma-button">
        <img
          src="../../../public/assets/img/company/company (3).png"
          alt="puma"
        />
      </button>
      <button id="asics-button">
        <img
          src="../../../public/assets/img/company/company (4).png"
          alt="asics"
        />
      </button>
      <button id="reebok-button">
        <img
          src="../../../public/assets/img/company/company (5).png"
          alt="reebok"
        />
      </button>
      <button id="newba-button">
        <img
          src="../../../public/assets/img/company/company (6).png"
          alt="newba"
        />
      </button>
      <button id="converse-button">
        <img
          src="../../../public/assets/img/company/company (7).png"
          alt="converse"
        />
      </button>
      <button id="more-button">
        <img
          src="../../../public/assets/img/company/company (8).png"
          alt="more"
        />
      </button>
    </div>

    <div class="flex flex-row justify-between p-4">
      <h3 class="text-[#343A40] font-bold text-lg">Most Popular</h3>
      <button id="See-all" class="text-[#343A40] font-bold text-base">See All</button>
    </div>

    <div class="overflow-x-scroll flex gap-4 whitespace-nowrap p-4 scrollbar-hide">
      <button  id="all-products-btn"
        class="border-2 border-solid border-[#343A40] text-[#343A40] rounded-2xl p-1 pr-3 pl-3 font-bold text-base hover:bg-[#343A40] hover:text-white"
      >
        All
      </button>
      <button id="nike-products-btn"
        class="border-2 border-solid border-[#343A40] text-[#343A40] rounded-2xl p-1 pr-3 pl-3 font-bold text-base hover:bg-[#343A40] hover:text-white"
      >
        Nike
      </button>
      <button id="adidas-products-btn"
        class="border-2 border-solid border-[#343A40] text-[#343A40] rounded-2xl p-1 pr-3 pl-3 font-bold text-base hover:bg-[#343A40] hover:text-white"
      >
        Adidas
      </button>
      <button id="puma-products-btn"
        class="border-2 border-solid border-[#343A40] text-[#343A40] rounded-2xl p-1 pr-3 pl-3 font-bold text-base hover:bg-[#343A40] hover:text-white"
      >
        Puma
      </button>
      <button id="asics-products-btn"
        class="border-2 border-solid border-[#343A40] text-[#343A40] rounded-2xl p-1 pr-3 pl-3 font-bold text-base hover:bg-[#343A40] hover:text-white"
      >
        Asics
      </button>
      <button id="reebok-products-btn"
        class="border-2 border-solid border-[#343A40] text-[#343A40] rounded-2xl p-1 pr-3 pl-3 font-bold text-base hover:bg-[#343A40] hover:text-white"
      >
        Reebok
      </button>
      <button id="newba-products-btn"
        class="border-2 border-solid border-[#343A40] text-[#343A40] rounded-2xl p-1 pr-3 pl-3 font-bold text-base hover:bg-[#343A40] hover:text-white"
      >
        New Ba..
      </button>
      <button id="onverse-products-btn"
        class="border-2 border-solid border-[#343A40] text-[#343A40] rounded-2xl p-1 pr-3 pl-3 font-bold text-base hover:bg-[#343A40] hover:text-white"
      >
        onverse
      </button>
    </div>
<!-- containor products -->
    <div id="products" class="grid grid-cols-2 p-2 overflow-y-scroll scrollbar-hide h-screen">
     
      <!-- <div>
        <img
          src="../../../public/assets/img/shoes/puma/puma1.jpg"

          class="w-48 h-48 rounded-2xl"
        />
        <h3 class="text-[#152536] font-bold">K-Swiss ista Train...</h3>
        <p>$ 85.00</p>
      </div>
      <div>
        <img
          src="../../../public/assets/img/shoes/puma/puma1.jpg"
          alt="puma"
          class="w-48 h-48 rounded-2xl"
        />
        <h3 class="text-[#152536] font-bold">K-Swiss ista Train...</h3>
        <p>$ 85.00</p>
      </div> -->
      
    </div>

    <footer
    class="flex flex-col justify-around fixed z-50 w-full h-16 bottom-0 bg-white shadow-2xl"
    >
    <div
    
  >
    <div class="flex flex-row justify-around">
      <button
      class="flex flex-col items-center group"
      onclick="changeImageAndRedirect(this)"
    >
      <img
        src="../../../public/assets/img/action Bar/images/house-door-fill.svg"
        alt="home"
        class="w-8 h-8"
      >
      <span>Home</span>
    </button>
      

      <button class="flex flex-col" onclick="changeCart(this)">
        <!-- <img src="../../../public/assets/img/action Bar/images/handbag-fill.svg" alt="handbag"> -->
        <img src="../../../public/assets/img/action Bar/images/handbag.svg" alt="handbag" class="w-8 h-8"> 
        <span>Cart</span>
      </button>
      <button class="flex flex-col" onclick="changeCartImage(this)">
        <img src="../../../public/assets/img/action Bar/images/cart2.svg" alt="order" class="w-8 h-8">
        
        <span>Orders</span>
      </button>
      <button class="flex flex-col">
        <img src="../../../public/assets/img/action Bar/images/wallet.svg" alt="wallet" class="w-8 h-8">
        <!-- <img src="../../../public/assets/img/action Bar/images/wallet-fill.svg" alt="wallet" > -->
        <span>Wallet</span>
      </button>
      <button class="flex flex-col">
        <img src="../../../public/assets/img/action Bar/images/person.svg" alt="Profile" class="w-8 h-8" >
        <!-- <img src="../../../public/assets/img/action Bar/images/person-fill.svg" alt="Profile"> -->

        <span>Profile</span>
      </button>
    </div>
  </div>
