<!DOCTYPE html>
<html lang="fa" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>document</title>
    <link rel="stylesheet" href="../../../public/style/output.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <style>
      .swiper {
        width: 100%;
        height: 100%;
      }

      .swiper-pagination-bullet {
        width: 40px;
        height: 4px;
        background: rgba(107, 104, 104, 0.2);
        opacity: 1;
        border-radius: 0;
      }
      .swiper-pagination-bullet-active {
        opacity: 1;
        background: rgb(70, 69, 69);
      }
      .swiper-pagination {
        bottom: 140px !important;
        margin-bottom: -30px;
      }

      .transition-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.5); 
  z-index: 9999;
  transform: translateY(-100%); 
  transition: transform 1s ease-out; 
}

.transition-container.transition-active {
  transform: translateY(0); 
}

    </style>
  </head>
  <body>

    <div class="transition-container"></div>


    <div class="swiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <div
            class="flex flex-col justify-center items-center content-center text-center"
          >
            <img
              src="../../../public/assets/img/started/shoe-1.png"
              alt="shoe-1"
              class="w-[428px] h-[643px]"
            />
            <h3
              class="text-3xl font-semibold mt-4 ml-4 mr-4 text-center"
              style="max-width: 350px; line-height: 1.5; word-break: break-word"
            >
              We provide high quality products just for you
            </h3>
            <button
              type="button"
              class="bg-[#212529] rounded-3xl text-white w-96 h-12 mt-20 next-btn"
            >
              Next
            </button>
          </div>
        </div>
        <div class="swiper-slide">
          <div
            class="flex flex-col justify-center items-center content-center text-center"
          >
            <img
              src="../../../public/assets/img/started/shoe-2.png"
              alt="shoe-1"
              class="w-[428px] h-[643px]"
            />
            <h3
              class="text-3xl font-semibold mt-4 ml-4 mb-20 mr-4 text-center"
              style="max-width: 350px; line-height: 1.5; word-break: break-word"
            >
              Your satisfaction is our number one priority
            </h3>
            <button
              type="button"
              class="bg-[#212529] rounded-3xl text-white w-96 h-12 next-btn"
            >
              Next
            </button>
          </div>
        </div>
        <div class="swiper-slide">
          <div
            class="flex flex-col justify-center items-center content-center text-center"
          >
            <img
              src="../../../public/assets/img/started/shoe-3.png"
              alt="shoe-1"
              class="w-[428px] h-[643px]"
            />
            <h3 class="text-3xl font-semibold mt-4">
              Let’s fulfill your fashion needs with shoearight now!
            </h3>
            <button
              type="button"
              class="bg-[#212529] rounded-3xl text-white w-96 h-12 mt-24 next-btn"
            >
              Get Started
            </button>
          </div>
        </div>
      </div>
      <div class="swiper-pagination"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="./loadswiper.js"></script>
  </body>
</html>
