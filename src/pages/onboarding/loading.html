<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shoe-shop</title>
    <link rel="stylesheet" href="../../../public/style/output.css" />
  </head>
  <style>
    swiper-container {
      width: 100%;
      height: 100%;
    }

    swiper-slide {
      text-align: right;
      background: #fff;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
    }

    swiper-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .autoplay-progress {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--swiper-theme-color);
    }

    .autoplay-progress svg {
      --progress: 0;
      position: absolute;
      left: 0;
      top: 0px;
      z-index: 10;
      width: 100%;
      height: 100%;
      stroke-width: 4px;
      stroke: var(--swiper-theme-color);
      fill: none;
      stroke-dashoffset: calc(125.6px * (1 - var(--progress)));
      stroke-dasharray: 125.6;
      transform: rotate(-90deg);
    }
  </style>
  <body>
    <swiper-container
      class="mySwiper"
      space-between="30"
      centered-slides="true"
      autoplay-delay="2500"
      autoplay-disable-on-interaction="false"
      style="width: 428px; height: 926px"
    >
      <swiper-slide>
        <div class="flex flex-col justify-center items-center content-center">
          <div
            class="w-56 h-16 pr-24 pb-96 pl-24 flex justify-center content-center items-center gap-5"
          >
            <img
              src="../../../public/assets/img/ondoarding icon.png"
              alt="logo"
              class="w-14 h-14"
            />
            <h2 class="text-[#152536] font-bold text-5xl">Shoea</h2>
          </div>
          <div class="pb-24 pl-48 pr-48">
            <div role="status">
              <svg
                aria-hidden="true"
                class="w-12 h-12 text-gray-200 animate-spin dark:text-gray-600 fill-black"
                viewBox="0 0 100 101"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                  fill="currentColor"
                />
                <path
                  d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                  fill="currentFill"
                />
              </svg>
              <span class="sr-only">Loading...</span>
            </div>
          </div>
        </div>
      </swiper-slide>
      <swiper-slide
        ><img
          src="../../../public/assets/img/Wallpaper-page2.png"
          alt="Wallpaper"
          class="relative w-full h-full"
        />
        <div class="absolute">
          <div class="flex ml-5 mt-96 gap-3">
            <h2 class="font-semibold text-4xl text-white">Welcome to</h2>
            <img
              src="../../../public/assets/img/👋.png"
              alt="imgHi"
              class="w-9 h-9"
            />
          </div>

          <h3 class="font-bold text-5xl text-white flex ml-5 mt-7">Shoea</h3>

          <p
            class="text-white font-semibold text-base mt-4 break-words whitespace-normal ml-5 w-64 text-left"
          >
            The best sneakers & shoes e-commerse app of the century for your
            fashion needs!
          </p>
        </div>
      </swiper-slide>

      <div class="autoplay-progress" slot="container-end">
        <svg viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="20"></circle>
        </svg>
        <span></span>
      </div>
    </swiper-container>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-element-bundle.min.js"></script>
    <script src="./loadingscript.js"></script>
  </body>
</html>
