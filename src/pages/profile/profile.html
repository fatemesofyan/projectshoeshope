<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../../../public/style/output.css" />
  </head>
  <body>
    <div
      class="w-full flex flex-row justify-between bg-white fixed top-0 z-10 pt-3 pr-4 pb-5"
    >
      <div class="flex flex-row pt-10 pl-4 gap-3">
        <img
          src="../../../public/assets/img/logo/login-icon.png"
          alt="arrow"
          class="w-8 h-8"
        />
        <h3 class="font-bold text-2xl text-[#152536]">My Cart</h3>
      </div>

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        fill="currentColor"
        class="bi bi-search h-6 w-6 mt-10 mr-3"
        viewBox="0 0 16 16"
      >
        <path
          d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"
        />
      </svg>
    </div>
    <div class="flex flex-col justify-center content-center items-center pt-28">
      <img
        src="../../../public/assets/img/profile-circle-svgrepo-com.svg"
        alt="profile"
        class="w-44 h-44"
      />
      <div class="flex flex-row justify-center items-center">
        <h2 class="font-bold text-2xl text-[#5a5b5c]">Hi,</h2>
        <img src="../../../public/assets/img/👋.png" alt="hi" class="w-8 h-8" />
      </div>
      <p class="font-bold text-xl text-[#b0b0b1]">Fateme Sofyan</p>
    </div>

    <div class="flex flex-col gap-5">
      <div
        id="home"
        class="flex flex-row justify-between gap-8 pt-8 p-4 bg-white shadow-md rounded-3xl ml-4 mr-4"
      >
        <div class="flex flex-row justify-center gap-4">
          <img
            src="../../../public/assets/img/action Bar/images/house-door.svg"
            alt="house"
            class="w-10 h-10"
          />
          <h2 class="text-3xl text-[#545557]">Home</h2>
        </div>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-caret-right w-10 h-10"
          viewBox="0 0 16 16"
        >
          <path
            d="M6 12.796V3.204L11.481 8zm.659.753 5.48-4.796a1 1 0 0 0 0-1.506L6.66 2.451C6.011 1.885 5 2.345 5 3.204v9.592a1 1 0 0 0 1.659.753"
          />
        </svg>
      </div>

      <div
        id="Order"
        class="flex flex-row justify-between gap-8 pt-8 p-4 bg-white shadow-md rounded-3xl ml-4 mr-4"
      >
        <div class="flex flex-row justify-center gap-4">
          <img
            src="../../../public/assets/img/action Bar/images/cart2.svg"
            alt="house"
            class="w-10 h-10"
          />
          <h2 class="text-3xl text-[#545557]">Order</h2>
        </div>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-caret-right w-10 h-10"
          viewBox="0 0 16 16"
        >
          <path
            d="M6 12.796V3.204L11.481 8zm.659.753 5.48-4.796a1 1 0 0 0 0-1.506L6.66 2.451C6.011 1.885 5 2.345 5 3.204v9.592a1 1 0 0 0 1.659.753"
          />
        </svg>
      </div>

      <div
        id="Cart"
        class="flex flex-row justify-between gap-8 pt-8 p-4 bg-white shadow-md rounded-3xl ml-4 mr-4"
      >
        <div class="flex flex-row justify-center gap-4">
          <img
            src="../../../public/assets/img/action Bar/images/handbag.svg"
            alt="house"
            class="w-10 h-10"
          />
          <h2 class="text-3xl text-[#545557]">Cart</h2>
        </div>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-caret-right w-10 h-10"
          viewBox="0 0 16 16"
        >
          <path
            d="M6 12.796V3.204L11.481 8zm.659.753 5.48-4.796a1 1 0 0 0 0-1.506L6.66 2.451C6.011 1.885 5 2.345 5 3.204v9.592a1 1 0 0 0 1.659.753"
          />
        </svg>
      </div>

      <div
        id="Wallet"
        class="flex flex-row justify-between gap-8 pt-8 p-4 bg-white shadow-md rounded-3xl ml-4 mr-4"
      >
        <div class="flex flex-row justify-center gap-4">
          <img
            src="../../../public/assets/img/action Bar/images/wallet.svg"
            alt="house"
            class="w-10 h-10"
          />
          <h2 class="text-3xl text-[#545557]">Wallet</h2>
        </div>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-caret-right w-10 h-10"
          viewBox="0 0 16 16"
        >
          <path
            d="M6 12.796V3.204L11.481 8zm.659.753 5.48-4.796a1 1 0 0 0 0-1.506L6.66 2.451C6.011 1.885 5 2.345 5 3.204v9.592a1 1 0 0 0 1.659.753"
          />
        </svg>
      </div>

      <div class="pl-5 pr-5 pt-4">
        <div
          id="SignOut"
          type="submit"
          class="bg-slate-950 rounded-3xl text-white w-full h-12 p-8 text-lg text-center flex justify-center items-center content-center gap-4"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-box-arrow-right text-white w-10 h-10"
            viewBox="0 0 16 16"
          >
            <path
              fill-rule="evenodd"
              d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"
            />
            <path
              fill-rule="evenodd"
              d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"
            />
          </svg>
          <h2>Sign Out</h2>
        </div>
      </div>
    </div>

    <script src="./profile.js"></script>
  </body>
</html>
