  <style>
    .tabs-container {
            position: relative;
            min-width: 90%;
            margin-left: auto;
            margin-right: auto;
            padding: 0 16px;
        }

        .tabs {
            display: flex;
            justify-content: space-around;
            padding-top: 20px;
            gap: 50px;
            position: relative;
        }

        .tab {
            padding-bottom: 8px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 22px;
            /* font-weight: bold; */
            position: relative;
            color: #666;
        }

        .tab:hover {
            color: #000;
        }

        .tab::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -25px;
            right: -25px;
            height: 3px;
            background-color: #000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tab:hover::after,
        .tab.active::after {
            opacity: 1;
        }

        .tab.active::after {
            opacity: 1;
        }

        .tab.active {
            color: #000;
        }

        .general-line {
            position: absolute;
            bottom: 0;
            left: 16px;
            right: 16px;
            height: 1px;
            background-color: #E5E7EB;
        }
  </style>

     <script>
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
