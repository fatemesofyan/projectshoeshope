<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../../../public/style/output.css" />
  </head>
  <body >
<div class=" flex justify-center ">
  <div class="flex justify-start content-start items-start mt-5 ">
    <img src="../../../public/assets/img/arrow-left-short.png" alt="arrow-left" />

    </div>

    <div class="flex flex-col justify-center items-center content-center gap-4">
      

      <img src="../../../public/assets/img/logo/login-icon.png" alt="logo" class="mt-20 mb-20"/>
      <h3 class="font-semibold text-3xl mb-3">Login to Your Account</h3>
      <div class="flex w-full">
        <button type="submit" class="p-2 bg-[#dbceeb86] text-white rounded-l-md border-none focus:outline-none">
          <img src="../../../public/assets/img/mail.png" alt="mail">
        </button>
        <input
        type="email"
        placeholder="Email"
        class="w-full pl-6 pr-2 bg-[#dbceeb86] border-none rounded-r-md text-sm text-black  focus:outline-none p-2"
      />
      </div>
    <div class="flex w-full">
      <button type="submit" class="p-2 bg-[#dbceeb86] text-black rounded-l-md border-none focus:outline-none">
        <img src="../../../public/assets/img/lock.png" alt="lock">
      </button>
      <input
      type="password"
      placeholder="Password"
      class="w-full pl-6 pr-2 bg-[#dbceeb86] border-none text-sm text-black  focus:outline-none p-2 "
    />
    <button type="submit" class="p-2 bg-[#dbceeb86] text-black rounded-r-md border-none focus:outline-none">
      <img src="../../../public/assets/img/eye-slash-fill.png" alt="lock">
    </button>
    </div>
    
      <div class="flex gap-3 mt-5">
        <input type="checkbox" name="remember" id="remember" class="checkbox" />
        <label for="remember" >Remember me</label>
      </div>
    
      <button
        type="submit"
        class="bg-slate-950 rounded-3xl text-white w-80 h-12 mt-40 mb-5"
      >
        Sing in
      </button>
    </div>
</div>
  </body>
</html>
