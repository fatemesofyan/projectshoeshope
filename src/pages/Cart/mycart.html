<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../../../public/style/output.css" />
  </head>
  <body class="bg-slate-50">
   
    <div
      class="w-full flex flex-row justify-between bg-white fixed top-0 z-10 pt-3 pr-4 pb-5"
    >
      <div class="flex flex-row pt-10 pl-4 gap-3">
        <img
          src="../../../public/assets/img/logo/login-icon.png"
          alt="arrow"
          class="w-8 h-8"
        />
        <h3 class="font-bold text-2xl text-[#152536]">Checkout</h3>
      </div>

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        fill="currentColor"
        class="bi bi-search h-6 w-6 mt-10 mr-3"
        viewBox="0 0 16 16"
      >
        <path
          d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"
        />
      </svg>
    </div>

    <div >
      <div  id="cart-container"
        class="pt-28 pl-5 pr-5 flex flex-col gap-3 overflow-y-scroll scrollbar-hide"
      >
        <div class="flex gap-4 rounded-3xl w-full shadow-md bg-white p-5">
          <div class="bg-[#F3F3F3] rounded-3xl w-28 p-3">
            <img
              src="../../../public/assets/img/shoes/Rectangle 7.png"
              alt="puma"
              class="w-20 h-20"
            />
          </div>
          <div class="flex flex-col">
            <div class="flex flex-row gap-8 justify-between">
              <h2 class="text-[#152536] font-bold text-base">
                Running Sportwear
              </h2>
              <img id="addtoCheckout"
                src="../../../public/assets/img/bin.svg"
                alt="delet"
                class="w-6 h-6 cursor-pointer"
              />
            </div>
            <div>
              <h3>black</h3>
              <p>Size=42</p>
            </div>

            <div
              class="flex flex-row justify-start items-center gap-10 pt-2 pb-2"
            >
              <h3 class="font-bold text-base text-[#152536]">Quantity</h3>

              <div class="bg-[#F3F3F3] rounded-lg">
                <button
                  class="bg-[#F3F3F3] p-2 pl-3 rounded-l-3xl font-bold text-base"
                >
                  -
                </button>
                <span class="bg-[#F3F3F3] p-2 text-base font-bold">2</span>
                <button
                  class="bg-[#F3F3F3] p-2 pr-3 rounded-r-3xl font-bold text-base"
                 
                >
                  +
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div 
        class="flex flex-col justify-around fixed z-50 w-full h-44 bottom-0 bg-white shadow-2xl rounded-tr-[50px] rounded-tl-[50px]"
      >
        <div class="flex flex-row justify-around">
          <div class="flex flex-col">
            <h6 class="text-gray-700">Total price</h6>
            <h2 id="total" class="font-bold text-2xl"></h2>
          </div>
          <button id="checkout-button"
            class="flex flex-row justify-center items-center gap-5 bg-slate-950 text-white text-lg rounded-3xl p-4 pr-16 pl-14"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-bag-fill w-6 h-6"
              viewBox="0 0 16 16"
            >
              <path
                d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4z"
              /></svg
            >Checkout
          </button>
        </div>

        <div class="flex flex-row justify-around">
          <button>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-house-door w-10 h-10"
              viewBox="0 0 16 16"
            >
              <path
                d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM2.5 14V7.707l5.5-5.5 5.5 5.5V14H10v-4a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v4z"
              />
            </svg>
          </button>

          <button>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-handbag w-10 h-10"
              viewBox="0 0 16 16"
            >
              <path
                d="M8 1a2 2 0 0 1 2 2v2H6V3a2 2 0 0 1 2-2m3 4V3a3 3 0 1 0-6 0v2H3.36a1.5 1.5 0 0 0-1.483 1.277L.85 13.13A2.5 2.5 0 0 0 3.322 16h9.355a2.5 2.5 0 0 0 2.473-2.87l-1.028-6.853A1.5 1.5 0 0 0 12.64 5zm-1 1v1.5a.5.5 0 0 0 1 0V6h1.639a.5.5 0 0 1 .494.426l1.028 6.851A1.5 1.5 0 0 1 12.678 15H3.322a1.5 1.5 0 0 1-1.483-1.723l1.028-6.851A.5.5 0 0 1 3.36 6H5v1.5a.5.5 0 1 0 1 0V6z"
              />
            </svg>
          </button>
          <button>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-cart2 w-10 h-10"
              viewBox="0 0 16 16"
            >
              <path
                d="M0 2.5A.5.5 0 0 1 .5 2H2a.5.5 0 0 1 .485.379L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 3H.5a.5.5 0 0 1-.5-.5M3.14 5l1.25 5h8.22l1.25-5zM5 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0m9-1a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0"
              />
            </svg>
          </button>
          <button>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-wallet2 w-10 h-10"
              viewBox="0 0 16 16"
            >
              <path
                d="M12.136.326A1.5 1.5 0 0 1 14 1.78V3h.5A1.5 1.5 0 0 1 16 4.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 13.5v-9a1.5 1.5 0 0 1 1.432-1.499zM5.562 3H13V1.78a.5.5 0 0 0-.621-.484zM1.5 4a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5z"
              />
            </svg>
          </button>
          <button>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-person w-10 h-10"
              viewBox="0 0 16 16"
            >
              <path
                d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div id="modal" class="hidden w-full h-full fixed top-0 left-0 z-50 bg-[#33333399]">
      <div
        class="fixed z-10 w-full h-[420px] bottom-0 bg-white shadow-2xl rounded-tr-[50px] rounded-tl-[50px]"
      >
        <div class="flex justify-center pt-6">
          <h2 class="font-bold text-2xl">Remove From Cart ?</h2>
        </div>
        <hr class="m-6" />
        <div id="modal-item-details"  class="flex gap-4 rounded-3xl w-full shadow-sm bg-white p-5">
          <div class="bg-[#F3F3F3] rounded-3xl w-28 p-3">
            <img
              src="../../../public/assets/img/shoes/Rectangle 7.png"
              alt="puma"
              class="w-20 h-20"
            />
          </div>
          <div class="flex flex-col">
            <div class="flex flex-row gap-8 justify-between">
              <h2 class="text-[#152536] font-bold text-base">
                Running Sportwear
              </h2>
              <img
                src="../../../public/assets/img/bin.svg"
                alt="delet"
                class="w-6 h-6"
              />
            </div>
            <div>
              <p>Size=42</p>
            </div>

            <div
              class="flex flex-row justify-start items-center gap-10 pt-2 pb-2"
            >
              <h3 class="font-bold text-base text-[#152536]">150.00</h3>

             
            </div>
          </div>
        </div>

        <hr class="m-6" />
        <div class="flex flex-row justify-around pb-5">
          <button id="cancelBtn" class="bg-slate-300 text-lg rounded-3xl p-3 pr-16 pl-14">
            cancel
          </button>

          <button
          id="confirmBtn" 
            class="bg-slate-950 text-white text-lg rounded-3xl p-3 pr-10 pl-8"
          >
            Yes,remove
          </button>
        </div>
      </div>
     
    </div>
    <script src="./mycart.js"></script>
  </body>
</html>
